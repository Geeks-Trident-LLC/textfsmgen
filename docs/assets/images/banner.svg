<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1E1E1E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- Accent left bar -->
  <rect x="0" y="0" width="12" height="260" fill="#00D1FF"/>

  <!-- Title -->
  <text x="60" y="120"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="72"
        font-weight="700"
        fill="#00D1FF">
    textfsmgen
  </text>

  <!-- Subtitle -->
  <text x="62" y="170"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="28"
        fill="#CCCCCC">
    A modern toolkit for TextFSM template generation, validation, and parsing
  </text>

  <!-- Decorative parsing lines -->
  <g stroke="#00D1FF" stroke-width="2" opacity="0.35">
    <line x1="60" y1="200" x2="1140" y2="200"/>
    <line x1="60" y1="225" x2="1140" y2="225"/>
  </g>
</svg>
