[tox]
envlist = py{39,310,311,312,313,314}
skip_missing_interpreters = true

[testenv]
deps = -r requirements-dev.txt
commands =
    python scripts/check_generic_imports.py
;    pytest --cov=textfsmgen --cov-report=term-missing --cov-fail-under=80 -sv {posargs:tests}

[testenv:lint]
basepython = python3.12        # pinned — flake8 runs here only
deps = flake8
commands = flake8 textfsmgen tests